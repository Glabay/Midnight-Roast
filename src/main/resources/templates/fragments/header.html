<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <header th:fragment="header" class="site-header">
        <nav class="nav-container">
            <div class="logo">
                <a th:href="@{/}">
                    <img th:src="@{/img/TMC.png}"
                         alt="The Midnight Coder logo image with Pokey the penguin working on his laptop"
                         class="logo-img logo-hide">
                    <span class="logo-text"><span>The Midnight </span><span>Coder</span></span>
                </a>
            </div>

            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>

            <div class="nav-menu">
                <div class="auth-buttons">
                    <div th:if="${#authorization.expression('isAuthenticated()')}" class="auth-user-container">
                        <div class="user-dropdown">
                            <button class="dropdown-btn">
                                <span class="user-nickname" th:text="${username}">Nickname</span>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <div class="dropdown-content">
                                <a th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}"
                                   th:href="@{/admin/dashboard}">
                                    <i class="fas fa-database"></i> Admin Panel</a>

                                <div class="dropdown-divider"></div>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div th:unless="${#authorization.expression('isAuthenticated()')}">
                        <a th:href="@{/login}" class="btn btn-outline">Login</a>
                        <a th:href="@{/register}" class="btn btn-primary">Sign Up</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
