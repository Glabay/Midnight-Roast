<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html(
    title=~{::title},
    links=~{::links},
    content=~{::content},
    scripts=~{::scripts}
)}">
<head>
    <title>Midnight Coder | Register</title>
    <th:block th:fragment="links">
        <link rel="stylesheet" th:href="@{/css/auth/register.css}">
    </th:block>
</head>
<body>
    <div th:fragment="content">
        <div class="register-container">
            <div class="register-logo">
                <img th:src="@{/img/TMC.png}" alt="TMC Logo">
            </div>
            <h2>Join <span>Midnight</span></h2>
            <div th:if="${error}" class="error-message" th:text="${error}">
                Registration failed.
            </div>
            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary register-btn">Register</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a th:href="@{/login}">Login here</a>
            </div>
        </div>
    </div>

    <th:block th:fragment="scripts">
    </th:block>
</body>
</html>
