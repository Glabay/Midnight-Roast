<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html(
    title=~{::title},
    links=~{::links},
    content=~{::content},
    scripts=~{::scripts}
)}">
<head>
    <title>Midnight Coder | Login</title>
    <th:block th:fragment="links">
        <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    </th:block>
</head>
<body>
    <div th:fragment="content">
        <div class="login-container">
            <div class="login-logo">
                <img th:src="@{/img/TMC.png}" alt="TMC Logo">
            </div>
            <h2>Login to <span>Midnight</span></h2>
            <div th:if="${param.error}" class="error-message">
                Invalid username or password.
            </div>
            <div th:if="${param.registered}" class="success-message">
                Registration successful! Please login.
            </div>
            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary login-btn">Login</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a th:href="@{/register}">Register here</a>
            </div>
        </div>
    </div>

    <th:block th:fragment="scripts">
    </th:block>
</body>
</html>
