spring.application.name=Midnight-Roast

spring.threads.virtual.enabled=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# THYMELEAF
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# LOGGING
logging.level.root=INFO
logging.level.dev.midnightcoder=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# DATASOURCE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.default_schema=public

# JWT + REFRESH
jwt.issuer=midnight-coder-jwt
jwt.audience=midnight-users
jwt.access-ttl-minutes=15
jwt.refresh-ttl-days=14
jwt.clock-skew-seconds=15
jwt.secret=${JWT_SECRET}
refresh.pepper=${REFRESH_TOKEN_PEPPER}

# SECURITY
security.cookies.secure=false
security.refresh.detect-reuse=true
security.refresh.revoke-family-on-reuse=true
security.refresh.cleanup-expired=false
security.refresh.cleanup-grace-days=7

# Auto-registration on startup (create user if not exists)
app.auto-register.username=${OWNER_NAME}
app.auto-register.password=${OWNER_PASSWORD}
app.auto-register.email=${OWNER_EMAIL}