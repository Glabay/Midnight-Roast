services:
  postgres:
    image: postgres:18.0-alpine
    container_name: midnight-roast-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - midnight-network

  redis:
    image: redis:8.12.0-alpine
    container_name: midnight-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

networks:
  midnight-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
